<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 背景グラデーション（ダークサイバーネイビー） -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- 体重計ガラスグラデーション -->
    <linearGradient id="scaleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- パパグラデーション（アクアブルー） -->
    <linearGradient id="papaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- ママグラデーション（チェリーピンク） -->
    <linearGradient id="mamaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>

    <!-- 液晶ディスプレイグラデーション -->
    <linearGradient id="lcdGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- 柔らかな光彩フィルター -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 角丸アイコン外枠（iOS / Android アプリアイコン標準の丸み） -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- 外枠の光彩リング -->
  <rect x="12" y="12" width="488" height="488" rx="103" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3" />

  <!-- 体重計の本体プレート（丸みのあるガラスモダンボード） -->
  <rect x="76" y="86" width="360" height="340" rx="60" fill="url(#scaleGrad)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="4" filter="url(#glow)" />
  
  <!-- 体重計のインナーフレーム -->
  <rect x="96" y="106" width="320" height="300" rx="44" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2" />

  <!-- 上部デジタルディスプレイ -->
  <rect x="176" y="120" width="160" height="64" rx="20" fill="#090d16" stroke="rgba(56, 189, 248, 0.4)" stroke-width="3" />
  
  <!-- デジタル数値表示（目標へ向かうヘルシーグリーン光彩） -->
  <text x="256" y="163" fill="url(#lcdGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" text-anchor="middle" letter-spacing="2">
    PAiR
  </text>

  <!-- 中央：パパ（水色）とママ（ピンク）の寄り添うハート＆シューズモチーフ -->
  <g transform="translate(256, 280)">
    <!-- パパのハート左半分 -->
    <path d="M 0 -45 
             C -20 -95, -95 -85, -95 -20 
             C -95 40, -10 80, 0 100 
             Z" 
          fill="url(#papaGrad)" 
          opacity="0.95" 
          filter="url(#glow)" />

    <!-- ママのハート右半分 -->
    <path d="M 0 -45 
             C 20 -95, 95 -85, 95 -20 
             C 95 40, 10 80, 0 100 
             Z" 
          fill="url(#mamaGrad)" 
          opacity="0.95" 
          filter="url(#glow)" />

    <!-- ハート中央の光沢 -->
    <circle cx="-32" cy="-35" r="14" fill="#ffffff" opacity="0.4" />
    <circle cx="32" cy="-35" r="14" fill="#ffffff" opacity="0.4" />

    <!-- 寄り添う足あと（パパの左足 & ママの右足） -->
    <!-- パパの足あと（水色） -->
    <g transform="translate(-46, 15) rotate(-12) scale(0.65)">
      <ellipse cx="0" cy="18" rx="16" ry="24" fill="#ffffff" opacity="0.9" />
      <circle cx="-14" cy="-14" r="5" fill="#ffffff" opacity="0.9" />
      <circle cx="-5" cy="-20" r="5.5" fill="#ffffff" opacity="0.9" />
      <circle cx="5" cy="-21" r="5.5" fill="#ffffff" opacity="0.9" />
      <circle cx="15" cy="-17" r="5" fill="#ffffff" opacity="0.9" />
    </g>

    <!-- ママの足あと（ピンク） -->
    <g transform="translate(46, 15) rotate(12) scale(0.65)">
      <ellipse cx="0" cy="18" rx="16" ry="24" fill="#ffffff" opacity="0.9" />
      <circle cx="14" cy="-14" r="5" fill="#ffffff" opacity="0.9" />
      <circle cx="5" cy="-20" r="5.5" fill="#ffffff" opacity="0.9" />
      <circle cx="-5" cy="-21" r="5.5" fill="#ffffff" opacity="0.9" />
      <circle cx="-15" cy="-17" r="5" fill="#ffffff" opacity="0.9" />
    </g>

    <!-- 中央のキラキラ（健康・シェイプアップの星） -->
    <path d="M 0 -55 L 6 -40 L 21 -40 L 9 -30 L 14 -15 L 0 -25 L -14 -15 L -9 -30 L -21 -40 L -6 -40 Z" fill="#facc15" filter="url(#glow)" />
  </g>

  <!-- 底部：ゴールドの月桂冠・ゴールアクセント（日本一周達成） -->
  <path d="M 160 405 Q 256 425 352 405" fill="none" stroke="url(#lcdGrad)" stroke-width="4" stroke-linecap="round" opacity="0.7" />
</svg>
